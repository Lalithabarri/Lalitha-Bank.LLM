[project]
name = "cua"
version = "0.1.0"
description = "LLM discovers a legacy-UI workflow once; a deterministic engine replays it forever."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7",
    "flask>=3.0",
    "playwright>=1.62",
]

[project.scripts]
legacy-bank = "legacy_bank.__main__:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cua", "src/legacy_bank"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "browser: drives a real Chromium via Playwright against a live Legacy Bank server",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
